services:
  - type: web
    name: saarthi-nexus-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: gunicorn -w 1 -k uvicorn.workers.UvicornWorker --timeout 120 --bind 0.0.0.0:$PORT app.main:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: MONGO_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGINS
        value: "https://saarthi-nexus.vercel.app,http://localhost:5173"
