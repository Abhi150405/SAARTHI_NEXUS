<svg viewBox="0 0 480 900" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
<circle cx="14" cy="14" r="1" fill="#242424"/>
</pattern>

<radialGradient id="rfade" cx="50%" cy="35%" r="65%" fx="50%" fy="35%">
<stop offset="0%" stop-color="white" stop-opacity="1"/>
<stop offset="100%" stop-color="white" stop-opacity="0"/>
</radialGradient>

<mask id="dotmask">
<rect width="480" height="900" fill="url(#rfade)"/>
</mask>
</defs>

<rect width="480" height="900" fill="url(#dots)" mask="url(#dotmask)"/>

<g stroke="#F97316" stroke-width="0.4" opacity="0.08" stroke-dasharray="5 12">
<line x1="0" y1="200" x2="480" y2="100"/>
<line x1="0" y1="500" x2="480" y2="420"/>
<line x1="0" y1="750" x2="480" y2="680"/>
</g>

<circle cx="360" cy="260" r="3" fill="#F97316" opacity="0.5"/>
<circle cx="360" cy="260" r="10" fill="none" stroke="#F97316" stroke-width="0.5" opacity="0.2"/>

<circle cx="80" cy="620" r="3" fill="#F97316" opacity="0.5"/>
<circle cx="80" cy="620" r="10" fill="none" stroke="#F97316" stroke-width="0.5" opacity="0.2"/>
</svg>