<svg viewBox="0 0 720 900" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern id="cross" width="48" height="48" patternUnits="userSpaceOnUse">
<line x1="24" y1="20" x2="24" y2="28" stroke="#1F1F1F" stroke-width="0.8"/>
<line x1="20" y1="24" x2="28" y2="24" stroke="#1F1F1F" stroke-width="0.8"/>
</pattern>

<radialGradient id="xfade" cx="50%" cy="45%" r="55%">
