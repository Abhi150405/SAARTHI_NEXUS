<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
<style>
@keyframes outerPulse{
0%{transform:scale(1);opacity:.5;}
100%{transform:scale(1.45);opacity:0;}
}
@keyframes circleGrow{
from{stroke-dasharray:0 176;}
to{stroke-dasharray:176 0;}
}
@keyframes checkDraw{
from{stroke-dashoffset:40;}
to{stroke-dashoffset:0;}
}
@keyframes bgFill{
from{opacity:0;}
to{opacity:.08;}
}
</style>

<circle cx="40" cy="40" r="36" fill="none" stroke="#22C55E" stroke-width="1" opacity="0"
style="animation:outerPulse 1.5s ease-out .6s infinite;transform-box:fill-box;transform-origin:center"/>

<circle cx="40" cy="40" r="28" fill="none" stroke="#1A1A1A" stroke-width="3"/>

<circle cx="40" cy="40" r="28" fill="#22C55E" opacity="0"
style="animation:bgFill .3s ease .9s forwards"/>

<circle cx="40" cy="40" r="28" fill="none" stroke="#22C55E" stroke-width="3" stroke-linecap="round"
transform="rotate(-90 40 40)"
style="stroke-dasharray:0 176;animation:circleGrow .6s cubic-bezier(.4,0,.2,1) .1s forwards"/>

<path d="M26 40 L36 50 L54 30" fill="none" stroke="#22C55E" stroke-width="3"
stroke-linecap="round" stroke-linejoin="round"
stroke-dasharray="40 40"
style="stroke-dashoffset:40;animation:checkDraw .4s ease .7s forwards"/>
</svg>