<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg">
<style>
@keyframes cardAppear{
from{opacity:0;transform:translateY(12px);}
to{opacity:1;transform:translateY(0);}
}
@keyframes countUp{
from{opacity:0;transform:translateY(4px);}
to{opacity:1;transform:translateY(0);}
}
@keyframes growBar{
from{transform:scaleX(0);}
to{transform:scaleX(1);}
}
@keyframes badgeFloat{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-4px);}
}
</style>

<rect x="280" y="0" width="120" height="24" rx="12" fill="#22C55E" opacity="0.12" stroke="#22C55E" stroke-width="0.5"
style="animation:badgeFloat 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center"/>
<circle cx="294" cy="12" r="4" fill="#22C55E"/>
<text x="304" y="12" font-size="9" fill="#22C55E" dominant-baseline="central" font-weight="600">Live Placement Data</text>

<g style="animation:cardAppear .7s ease .2s both;transform-box:fill-box;transform-origin:center">

<rect x="20" y="10" width="360" height="295" rx="16" fill="#111111" stroke="#2A2A2A"/>
<rect x="20" y="10" width="360" height="44" rx="16" fill="#111111" stroke="#2A2A2A"/>
<line x1="20" y1="54" x2="380" y2="54" stroke="#1F1F1F"/>

